<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — OBR</title>
<style>
  :root{
    --bg:#f3f5f4; --surface:#ffffff; --border:#e2e7e6; --ink:#14201e; --ink2:#43514e;
    --muted:#7d8a87; --accent:#0e5f5a; --accent2:#127e77; --accent-ink:#ffffff;
    --good:#1c7c54; --warn:#b06a00; --danger:#b23b3b; --shadow:0 1px 3px rgba(20,32,30,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1513; --surface:#152220; --border:#26332f; --ink:#e8efec; --ink2:#aebbb7;
      --muted:#7f8f8b; --accent:#3fb8ad; --accent2:#57cabf; --accent-ink:#06201d;
      --good:#54c98c; --warn:#e0a24a; --danger:#e57373; --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 48px}
  h1,h2,h3{margin:0}
  .muted{color:var(--muted)}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:11px 16px;font-weight:600}
  .btn:hover{background:var(--accent2)}
  .btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--border)}

  /* Login */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
  .login-card{width:100%;max-width:380px;padding:30px 26px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:800;font-size:15px}
  .login-card h1{font-size:19px;letter-spacing:-.01em}
  .field{margin-top:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  .field input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  #login .btn{width:100%;margin-top:20px;padding:12px}
  .err{color:var(--danger);font-size:13.5px;margin-top:12px;min-height:18px}

  /* App */
  #app{display:none}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 2px 18px}
  header.top .brand h1{font-size:17px}
  header.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
  select{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .kpi .val{font-size:24px;font-weight:750;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
  .kpi.accent .val{color:var(--accent)}
  .kpi.warn .val{color:var(--warn)}

  section.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-top:16px;padding:16px 18px}
  section.panel h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin-bottom:14px}

  /* Chart */
  .chart{width:100%;height:200px}
  .chart .bar{fill:var(--accent);transition:opacity .15s}
  .chart .bar:hover{opacity:.75}
  .chart .axis{stroke:var(--border)}
  .chart text{fill:var(--muted);font-size:10px}

  /* Table */
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
  .pill.sent{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
  .pill.draft{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--ink2)}
  .pill.cancel{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
  .loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<div id="login">
  <form class="card login-card" onsubmit="doLogin(event)">
    <div class="brand"><div class="logo">OBR</div><h1>Tableau de bord</h1></div>
    <p class="muted" style="font-size:13.5px;margin:0">Connectez-vous pour consulter l'activité de votre société.</p>
    <div class="field"><label>Adresse e-mail</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label>Mot de passe</label><input id="pwd" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app"><div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">OBR</div><h1 id="coName">…</h1></div>
    <div class="who">
      <select id="coSelect" style="display:none" onchange="render()"></select>
      <span id="userEmail"></span>
      <button class="btn ghost" onclick="logout()">Quitter</button>
    </div>
  </header>
  <div id="content"><div class="loading">Chargement…</div></div>
</div></div>

<script>
const SUPABASE_URL="https://pcmkpkqnvexybmjgnsec.supabase.co", ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjbWtwa3FudmV4eWJtamduc2VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MjA0NDcsImV4cCI6MjEwNDM5NjQ0N30.kUKDuOuHjFkZfNEcBR3BHOmLQ8_bGeuw9zqrxEUJXRY";
const TK="obr_report_token";
let token=null, invoices=[], companies=[];

function api(path, extra){
  return fetch(SUPABASE_URL+"/rest/v1/"+path, {headers:Object.assign(
    {apikey:ANON, Authorization:"Bearer "+token}, extra||{})});
}
const fmt=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(Math.round(n||0));
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function doLogin(e){
  e.preventDefault();
  const err=document.getElementById("loginErr"); err.textContent="";
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST", headers:{apikey:ANON,"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("email").value.trim(),
                           password:document.getElementById("pwd").value})});
    const d=await r.json();
    if(!r.ok||!d.access_token){ err.textContent=d.error_description||d.msg||"Identifiants incorrects."; return; }
    token=d.access_token; localStorage.setItem(TK,token);
    document.getElementById("userEmail").textContent=document.getElementById("email").value.trim();
    start();
  }catch(ex){ err.textContent="Connexion impossible. Vérifiez votre réseau."; }
}
function logout(){ localStorage.removeItem(TK); location.reload(); }

async function start(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  // sociétés autorisées (RLS : ne renvoie que les siennes)
  const rc=await api("report_access?select=company_id,company_name&order=company_name");
  if(rc.status===401){ logout(); return; }
  companies=await rc.json();
  const sel=document.getElementById("coSelect");
  if(companies.length>1){
    sel.style.display=""; sel.innerHTML=companies.map(c=>`<option value="${c.company_id}">${esc(c.company_name)}</option>`).join("");
  }
  if(!companies.length){ document.getElementById("content").innerHTML='<div class="loading">Aucune société associée à ce compte.</div>'; return; }
  render();
}

async function render(){
  const sel=document.getElementById("coSelect");
  const co=companies.find(c=>String(c.company_id)===sel.value)||companies[0];
  document.getElementById("coName").textContent=co.company_name||"Ma société";
  document.getElementById("content").innerHTML='<div class="loading">Chargement…</div>';
  const r=await api("invoices?company_id=eq."+co.company_id+
    "&select=number,date,client_name,total_ttc,status,payment_status,paid_amount&order=date.desc");
  if(!r.ok){ document.getElementById("content").innerHTML='<div class="loading">Lecture impossible.</div>'; return; }
  invoices=await r.json();
  draw();
}

function draw(){
  const real=invoices.filter(i=>i.status==="sent"||i.status==="issued");
  const ca=real.reduce((s,i)=>s+(i.total_ttc||0),0);
  const nb=real.length;
  const unpaid=invoices.filter(i=>i.status!=="cancelled").reduce((s,i)=>s+Math.max(0,(i.total_ttc||0)-(i.paid_amount||0)),0);
  const panier=nb?ca/nb:0;

  // ventes par mois (12 derniers mois)
  const now=new Date(), months=[];
  for(let k=11;k>=0;k--){ const d=new Date(now.getFullYear(),now.getMonth()-k,1);
    months.push({key:d.toISOString().slice(0,7), lbl:d.toLocaleDateString("fr-FR",{month:"short"}), v:0}); }
  const idx={}; months.forEach((m,i)=>idx[m.key]=i);
  real.forEach(i=>{ const k=(i.date||"").slice(0,7); if(k in idx) months[idx[k]].v+=(i.total_ttc||0); });

  const kpi=(cls,lbl,val,unit)=>`<div class="kpi ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}${unit?' <small>'+unit+'</small>':''}</div></div>`;
  let html=`<div class="kpis">
    ${kpi("accent","Chiffre d'affaires",fmt(ca),"FBu")}
    ${kpi("","Factures émises",fmt(nb),"")}
    ${kpi("warn","Impayés",fmt(unpaid),"FBu")}
    ${kpi("","Panier moyen",fmt(panier),"FBu")}
  </div>`;

  html+=`<section class="panel"><h2>Ventes des 12 derniers mois</h2>${barChart(months)}</section>`;

  const rows=invoices.slice(0,12).map(i=>{
    const cls=i.status==="sent"||i.status==="issued"?"sent":(i.status==="cancelled"?"cancel":"draft");
    const lbl=i.status==="sent"?"Transmise":i.status==="issued"?"Émise":i.status==="cancelled"?"Annulée":"Brouillon";
    return `<tr><td>${esc(i.number)}</td><td>${esc(i.date)}</td><td>${esc(i.client_name)}</td>
      <td class="num">${fmt(i.total_ttc)}</td><td><span class="pill ${cls}">${lbl}</span></td></tr>`;
  }).join("");
  html+=`<section class="panel"><h2>Dernières factures</h2><div class="tbl-scroll"><table>
    <thead><tr><th>N°</th><th>Date</th><th>Client</th><th class="num">Montant TTC</th><th>Statut</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="5" class="muted" style="padding:20px;text-align:center">Aucune facture.</td></tr>'}</tbody>
    </table></div></section>`;

  document.getElementById("content").innerHTML=html;
}

function barChart(months){
  const W=720,H=200,pad=28,bw=(W-2*pad)/months.length, max=Math.max(1,...months.map(m=>m.v));
  let bars="",labels="";
  months.forEach((m,i)=>{
    const h=(H-2*pad)*(m.v/max), x=pad+i*bw+bw*0.15, y=H-pad-h, w=bw*0.7;
    bars+=`<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3"><title>${m.lbl} : ${fmt(m.v)} FBu</title></rect>`;
    labels+=`<text x="${(x+w/2).toFixed(1)}" y="${H-pad+13}" text-anchor="middle">${m.lbl}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ventes par mois">
    <line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>${bars}${labels}</svg>`;
}

// reprise de session
token=localStorage.getItem(TK);
if(token){ start(); }
</script>
</body>
</html>
